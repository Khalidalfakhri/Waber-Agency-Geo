<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#041a0c"/>
      <stop offset="100%" stop-color="#020a06"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Shopping cart -->
  <g transform="translate(320, 220)">
    <!-- Cart body -->
    <path d="M-100,-60 L-80,-60 L-60,40 L80,40 L100,-30 L-70,-30" 
      fill="none" stroke="#059669" stroke-width="3" stroke-opacity="0.7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Cart wheels -->
    <circle cx="-40" cy="55" r="14" fill="none" stroke="#059669" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="60" cy="55" r="14" fill="none" stroke="#059669" stroke-width="3" stroke-opacity="0.7"/>
    <circle cx="-40" cy="55" r="5" fill="#059669" fill-opacity="0.5"/>
    <circle cx="60" cy="55" r="5" fill="#059669" fill-opacity="0.5"/>
    <!-- Items in cart -->
    <rect x="-55" y="-20" width="30" height="30" rx="4" fill="#059669" fill-opacity="0.3" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5"/>
    <rect x="-18" y="-25" width="28" height="35" rx="4" fill="#059669" fill-opacity="0.25" stroke="#059669" stroke-width="1.5" stroke-opacity="0.4"/>
    <rect x="16" y="-15" width="32" height="25" rx="4" fill="#059669" fill-opacity="0.3" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5"/>
    <!-- Checkout badge -->
    <rect x="55" y="-70" width="70" height="35" rx="10" fill="#059669" fill-opacity="0.8"/>
    <text x="90" y="-48" text-anchor="middle" font-size="14" font-weight="bold" fill="#f5f0e8" font-family="Arial">+3</text>
  </g>
  <!-- Product boxes -->
  <g opacity="0.6">
    <!-- Box 1 -->
    <rect x="100" y="220" width="80" height="80" rx="8" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="100" y1="260" x2="180" y2="260" stroke="#059669" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="140" y1="220" x2="140" y2="300" stroke="#059669" stroke-width="1" stroke-opacity="0.3"/>
    <polygon points="105,223 175,223 180,218 110,218" fill="#059669" fill-opacity="0.3"/>
    <!-- Box 2 -->
    <rect x="580" y="180" width="100" height="100" rx="8" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="2" stroke-opacity="0.5"/>
    <line x1="580" y1="230" x2="680" y2="230" stroke="#059669" stroke-width="1" stroke-opacity="0.3"/>
    <line x1="630" y1="180" x2="630" y2="280" stroke="#059669" stroke-width="1" stroke-opacity="0.3"/>
    <polygon points="586,184 674,184 680,177 592,177" fill="#059669" fill-opacity="0.3"/>
    <!-- Box 3 small -->
    <rect x="620" y="310" width="60" height="60" rx="6" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-width="1.5" stroke-opacity="0.4"/>
    <polygon points="624,313 676,313 680,308 628,308" fill="#059669" fill-opacity="0.2"/>
  </g>
  <!-- Online store screen -->
  <rect x="100" y="90" width="200" height="110" rx="10" fill="#040e07" stroke="#059669" stroke-width="1.5" stroke-opacity="0.5"/>
  <rect x="100" y="90" width="200" height="22" rx="10" fill="#059669" fill-opacity="0.2"/>
  <rect x="115" y="125" width="70" height="30" rx="4" fill="#059669" fill-opacity="0.2"/>
  <rect x="195" y="125" width="90" height="30" rx="4" fill="#059669" fill-opacity="0.15"/>
  <rect x="115" y="162" width="170" height="8" rx="2" fill="#f5f0e8" fill-opacity="0.1"/>
  <rect x="115" y="177" width="130" height="8" rx="2" fill="#f5f0e8" fill-opacity="0.08"/>
  <!-- Riyal symbol -->
  <g transform="translate(620, 110)" opacity="0.4">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#059669" stroke-width="2" stroke-opacity="0.5"/>
    <text x="0" y="12" text-anchor="middle" font-size="36" font-weight="900" fill="#059669" font-family="Arial">﷼</text>
  </g>
  <!-- Growth line -->
  <polyline points="100,360 180,320 260,330 340,280 420,260 500,220 580,200 660,165" 
    fill="none" stroke="#059669" stroke-width="2.5" stroke-opacity="0.5" stroke-linecap="round"/>
  <circle cx="660" cy="165" r="6" fill="#059669"/>
</svg>