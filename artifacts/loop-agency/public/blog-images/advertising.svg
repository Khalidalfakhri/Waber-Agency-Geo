<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#200404"/>
      <stop offset="100%" stop-color="#0a0000"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Traditional billboard (left, faded/crossed out) -->
  <g opacity="0.4">
    <!-- Billboard post -->
    <rect x="90" y="250" width="12" height="140" rx="4" fill="#dc2626" fill-opacity="0.4"/>
    <!-- Billboard board -->
    <rect x="40" y="130" width="200" height="120" rx="6" fill="#1a0404" stroke="#dc2626" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Content faded -->
    <rect x="56" y="148" width="160" height="12" rx="3" fill="#dc2626" fill-opacity="0.3"/>
    <rect x="56" y="168" width="130" height="10" rx="3" fill="#f5f0e8" fill-opacity="0.15"/>
    <rect x="56" y="186" width="150" height="10" rx="3" fill="#f5f0e8" fill-opacity="0.1"/>
    <rect x="56" y="210" width="80" height="22" rx="4" fill="#dc2626" fill-opacity="0.25"/>
    <!-- X mark over billboard -->
    <line x1="40" y1="130" x2="240" y2="250" stroke="#dc2626" stroke-width="4" stroke-opacity="0.6" stroke-linecap="round"/>
    <line x1="240" y1="130" x2="40" y2="250" stroke="#dc2626" stroke-width="4" stroke-opacity="0.6" stroke-linecap="round"/>
  </g>
  <!-- TV (traditional, faded) -->
  <g opacity="0.35" transform="translate(300, 160)">
    <rect x="0" y="0" width="120" height="90" rx="8" fill="#1a0404" stroke="#dc2626" stroke-width="2" stroke-opacity="0.4"/>
    <rect x="8" y="8" width="104" height="74" rx="4" fill="#0a0000"/>
    <!-- TV static -->
    <g fill="#f5f0e8" fill-opacity="0.08">
      <rect x="12" y="12" width="8" height="6"/><rect x="24" y="12" width="8" height="6"/>
      <rect x="36" y="12" width="8" height="6"/><rect x="48" y="12" width="8" height="6"/>
      <rect x="60" y="12" width="8" height="6"/><rect x="72" y="12" width="8" height="6"/>
      <rect x="84" y="12" width="8" height="6"/><rect x="96" y="12" width="8" height="6"/>
      <rect x="12" y="24" width="8" height="6"/><rect x="24" y="24" width="8" height="6"/>
      <rect x="36" y="24" width="8" height="6"/>
    </g>
    <rect x="50" y="90" width="20" height="16" rx="2" fill="#dc2626" fill-opacity="0.3"/>
    <!-- X over TV -->
    <line x1="0" y1="0" x2="120" y2="90" stroke="#dc2626" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
    <line x1="120" y1="0" x2="0" y2="90" stroke="#dc2626" stroke-width="3" stroke-opacity="0.5" stroke-linecap="round"/>
  </g>
  <!-- Digital phone (bright, emerging right) -->
  <g opacity="0.9" transform="translate(520, 100)">
    <rect x="0" y="0" width="140" height="260" rx="20" fill="#0f0520" stroke="#0d9488" stroke-width="2.5" stroke-opacity="0.8"/>
    <rect x="10" y="20" width="120" height="220" rx="8" fill="#070318"/>
    <!-- App icons on screen -->
    <g>
      <rect x="20" y="35" width="44" height="44" rx="10" fill="#0d9488" fill-opacity="0.4"/>
      <rect x="76" y="35" width="44" height="44" rx="10" fill="#7c3aed" fill-opacity="0.35"/>
      <rect x="20" y="90" width="44" height="44" rx="10" fill="#db2777" fill-opacity="0.35"/>
      <rect x="76" y="90" width="44" height="44" rx="10" fill="#2563eb" fill-opacity="0.3"/>
      <rect x="20" y="145" width="100" height="36" rx="8" fill="#0d9488" fill-opacity="0.25"/>
      <rect x="30" y="155" width="70" height="8" rx="2" fill="#0d9488" fill-opacity="0.5"/>
      <rect x="20" y="190" width="100" height="36" rx="8" fill="#0d9488" fill-opacity="0.15"/>
    </g>
    <!-- Checkmark: digital works -->
    <circle cx="130" cy="10" r="18" fill="#0d9488"/>
    <path d="M122,10 L128,16 L138,5" fill="none" stroke="#f5f0e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Arrow from left to right -->
  <line x1="250" y1="230" x2="510" y2="230" stroke="#dc2626" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 5"/>
  <polygon points="510,224 510,236 526,230" fill="#0d9488" fill-opacity="0.6"/>
  <!-- Label bottom -->
  <text x="140" y="390" text-anchor="middle" font-size="14" fill="#dc2626" fill-opacity="0.5" font-family="Arial">Traditional</text>
  <text x="590" y="390" text-anchor="middle" font-size="14" fill="#0d9488" fill-opacity="0.6" font-family="Arial">Digital</text>
</svg>