<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="40%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a0c2a"/>
      <stop offset="100%" stop-color="#06070f"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Browser window -->
  <rect x="160" y="100" width="480" height="300" rx="12" fill="#0b0d20" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="160" y="100" width="480" height="36" rx="12" fill="#4f46e5" fill-opacity="0.25"/>
  <!-- Traffic lights -->
  <circle cx="185" cy="118" r="7" fill="#ef4444" fill-opacity="0.7"/>
  <circle cx="205" cy="118" r="7" fill="#f59e0b" fill-opacity="0.7"/>
  <circle cx="225" cy="118" r="7" fill="#22c55e" fill-opacity="0.7"/>
  <!-- URL bar -->
  <rect x="245" y="109" width="300" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>
  <text x="255" y="122" font-size="9" fill="#f5f0e8" fill-opacity="0.4" font-family="monospace">waberagency.com</text>
  <!-- Wireframe layout inside browser -->
  <!-- Header bar -->
  <rect x="175" y="148" width="450" height="32" rx="4" fill="#4f46e5" fill-opacity="0.2"/>
  <rect x="185" y="157" width="60" height="14" rx="3" fill="#4f46e5" fill-opacity="0.4"/>
  <rect x="490" y="157" width="40" height="14" rx="3" fill="#f5f0e8" fill-opacity="0.1"/>
  <rect x="540" y="157" width="40" height="14" rx="3" fill="#f5f0e8" fill-opacity="0.1"/>
  <rect x="590" y="157" width="25" height="14" rx="3" fill="#4f46e5" fill-opacity="0.5"/>
  <!-- Hero section -->
  <rect x="175" y="190" width="450" height="90" rx="4" fill="#4f46e5" fill-opacity="0.08"/>
  <rect x="280" y="205" width="240" height="16" rx="3" fill="#4f46e5" fill-opacity="0.3"/>
  <rect x="310" y="228" width="180" height="10" rx="3" fill="#f5f0e8" fill-opacity="0.12"/>
  <rect x="330" y="248" width="140" height="22" rx="11" fill="#4f46e5" fill-opacity="0.4"/>
  <!-- Cards row -->
  <rect x="175" y="292" width="138" height="80" rx="6" fill="#4f46e5" fill-opacity="0.12" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="323" y="292" width="138" height="80" rx="6" fill="#4f46e5" fill-opacity="0.12" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="471" y="292" width="154" height="80" rx="6" fill="#4f46e5" fill-opacity="0.12" stroke="#4f46e5" stroke-width="1" stroke-opacity="0.3"/>
  <!-- Card content -->
  <rect x="185" y="304" width="80" height="30" rx="4" fill="#4f46e5" fill-opacity="0.2"/>
  <rect x="185" y="342" width="100" height="8" rx="2" fill="#f5f0e8" fill-opacity="0.15"/>
  <rect x="185" y="355" width="70" height="6" rx="2" fill="#f5f0e8" fill-opacity="0.1"/>
  <!-- Code brackets -->
  <text x="100" y="240" font-size="80" font-weight="900" fill="#4f46e5" fill-opacity="0.12" font-family="monospace">&lt;/&gt;</text>
  <text x="600" y="300" font-size="60" font-weight="900" fill="#4f46e5" fill-opacity="0.12" font-family="monospace">{}</text>
  <!-- Cursor -->
  <g transform="translate(580, 230)" opacity="0.7">
    <polygon points="0,0 0,22 6,16 10,26 13,25 9,15 16,15" fill="#f5f0e8" fill-opacity="0.6"/>
  </g>
</svg>