<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e0d3e"/>
      <stop offset="100%" stop-color="#0a0318"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Glow -->
  <ellipse cx="400" cy="225" rx="300" ry="200" fill="url(#glow)"/>
  <!-- Target rings -->
  <circle cx="400" cy="225" r="160" fill="none" stroke="#0d9488" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="400" cy="225" r="120" fill="none" stroke="#0d9488" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="400" cy="225" r="80" fill="none" stroke="#0d9488" stroke-width="2.5" stroke-opacity="0.7"/>
  <circle cx="400" cy="225" r="40" fill="none" stroke="#0d9488" stroke-width="3" stroke-opacity="0.9"/>
  <circle cx="400" cy="225" r="14" fill="#0d9488"/>
  <!-- Crosshairs -->
  <line x1="240" y1="225" x2="370" y2="225" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="430" y1="225" x2="560" y2="225" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="400" y1="65" x2="400" y2="200" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.5"/>
  <line x1="400" y1="250" x2="400" y2="385" stroke="#0d9488" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- Arrow hitting target -->
  <line x1="560" y1="85" x2="418" y2="218" stroke="#f5f0e8" stroke-width="3" stroke-linecap="round"/>
  <polygon points="408,212 430,205 424,228" fill="#f5f0e8"/>
  <!-- Gear bottom right -->
  <g transform="translate(640,340) scale(0.7)" opacity="0.4">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#0d9488" stroke-width="3"/>
    <circle cx="0" cy="0" r="10" fill="#0d9488"/>
    <rect x="-5" y="-32" width="10" height="12" rx="2" fill="#0d9488"/>
    <rect x="-5" y="20" width="10" height="12" rx="2" fill="#0d9488"/>
    <rect x="20" y="-5" width="12" height="10" rx="2" fill="#0d9488"/>
    <rect x="-32" y="-5" width="12" height="10" rx="2" fill="#0d9488"/>
  </g>
  <!-- Stats bars top left -->
  <g opacity="0.35" transform="translate(100,300)">
    <rect x="0" y="-60" width="18" height="60" rx="3" fill="#0d9488"/>
    <rect x="26" y="-90" width="18" height="90" rx="3" fill="#0d9488"/>
    <rect x="52" y="-45" width="18" height="45" rx="3" fill="#0d9488"/>
    <rect x="78" y="-110" width="18" height="110" rx="3" fill="#0d9488"/>
  </g>
</svg>