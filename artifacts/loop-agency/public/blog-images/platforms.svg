<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#160826"/>
      <stop offset="100%" stop-color="#080314"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Left phone - TikTok style -->
  <rect x="210" y="85" width="160" height="290" rx="22" fill="#0a0514" stroke="#9333ea" stroke-width="2.5" stroke-opacity="0.8"/>
  <rect x="222" y="105" width="136" height="250" rx="8" fill="#0f0520"/>
  <!-- TikTok style content -->
  <rect x="222" y="105" width="136" height="250" rx="8" fill="#9333ea" fill-opacity="0.06"/>
  <!-- Music note icon -->
  <text x="290" y="220" text-anchor="middle" font-size="48" fill="#9333ea" fill-opacity="0.5">♪</text>
  <!-- TikTok labels -->
  <rect x="232" y="115" width="80" height="7" rx="3" fill="#f5f0e8" fill-opacity="0.2"/>
  <rect x="232" y="128" width="60" height="6" rx="3" fill="#f5f0e8" fill-opacity="0.12"/>
  <!-- Like stack -->
  <g opacity="0.6" transform="translate(330, 240)">
    <text x="0" y="0" font-size="14" fill="#9333ea">♥</text>
    <text x="0" y="20" font-size="10" fill="#f5f0e8" fill-opacity="0.5">245K</text>
    <text x="0" y="50" font-size="14" fill="#9333ea" opacity="0.7">💬</text>
    <text x="0" y="70" font-size="10" fill="#f5f0e8" fill-opacity="0.4">8.2K</text>
  </g>
  <!-- Trending upward on TikTok phone -->
  <polyline points="232,330 252,310 272,315 292,290 312,280 332,255 352,245" 
    fill="none" stroke="#9333ea" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round"/>
  <!-- Right phone - Snapchat style -->
  <rect x="430" y="85" width="160" height="290" rx="22" fill="#0a0514" stroke="#f5d020" stroke-width="2.5" stroke-opacity="0.7"/>
  <rect x="442" y="105" width="136" height="250" rx="8" fill="#0f0520"/>
  <!-- Snapchat ghost shape -->
  <g transform="translate(510, 215)">
    <circle cx="0" cy="-30" r="32" fill="#f5d020" fill-opacity="0.25"/>
    <path d="M-32,0 Q-32,20 -20,28 Q-30,32 -20,40 Q0,30 20,40 Q30,32 20,28 Q32,20 32,0 Q32,-10 20,-15 L20,-50 Q20,-80 0,-80 Q-20,-80 -20,-50 L-20,-15 Q-32,-10 -32,0Z" 
      fill="#f5d020" fill-opacity="0.2" stroke="#f5d020" stroke-width="1.5" stroke-opacity="0.5"/>
    <circle cx="-10" cy="-28" r="5" fill="#f5d020" fill-opacity="0.6"/>
    <circle cx="10" cy="-28" r="5" fill="#f5d020" fill-opacity="0.6"/>
  </g>
  <!-- Snap counter -->
  <rect x="452" y="115" width="60" height="7" rx="3" fill="#f5f0e8" fill-opacity="0.15"/>
  <rect x="452" y="128" width="45" height="6" rx="3" fill="#f5f0e8" fill-opacity="0.1"/>
  <!-- Story rings -->
  <circle cx="510" cy="320" r="22" fill="none" stroke="#f5d020" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="4 3"/>
  <circle cx="510" cy="320" r="15" fill="#f5d020" fill-opacity="0.2"/>
  <text x="510" y="325" text-anchor="middle" font-size="12" fill="#f5f0e8" fill-opacity="0.6">👁</text>
  <!-- VS label between phones -->
  <text x="400" y="233" text-anchor="middle" font-size="28" font-weight="900" fill="#f5f0e8" fill-opacity="0.25" font-family="Arial">VS</text>
  <!-- Upward arrows -->
  <g opacity="0.4">
    <line x1="150" y1="300" x2="150" y2="150" stroke="#9333ea" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="150,145 144,162 156,162" fill="#9333ea"/>
    <line x1="650" y1="300" x2="650" y2="150" stroke="#f5d020" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="650,145 644,162 656,162" fill="#f5d020"/>
  </g>
</svg>