<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#031520"/>
      <stop offset="100%" stop-color="#010609"/>
    </radialGradient>
    <linearGradient id="funnelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Funnel shape -->
  <g transform="translate(400, 60)">
    <!-- Top wide (visitors) -->
    <path d="M-200,0 L200,0 L200,50 L-200,50 Z" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.4"/>
    <!-- Stage 2 (engaged) -->
    <path d="M200,50 L120,50 L120,130 L-120,130 L-120,50 L-200,50 Z" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.45"/>
    <!-- Stage 3 (interested) -->
    <path d="M120,130 L70,130 L70,200 L-70,200 L-70,130 L-120,130 Z" fill="#0891b2" fill-opacity="0.3" stroke="#0891b2" stroke-width="2" stroke-opacity="0.5"/>
    <!-- Stage 4 (buyers) -->
    <path d="M70,200 L30,200 L30,260 L-30,260 L-30,200 L-70,200 Z" fill="#0891b2" fill-opacity="0.45" stroke="#0891b2" stroke-width="2" stroke-opacity="0.6"/>
    <!-- Bottom tip (loyal customers) -->
    <path d="M30,260 L-30,260 L0,310 Z" fill="#0891b2" fill-opacity="0.7" stroke="#0891b2" stroke-width="2.5" stroke-opacity="0.8"/>
    <!-- Labels right side -->
    <g fill="#f5f0e8" fill-opacity="0.5" font-family="Arial" font-size="12">
      <text x="215" y="30">زوار</text>
      <text x="135" y="100">مهتمون</text>
      <text x="85" y="175">متفاعلون</text>
      <text x="45" y="238">مشترون</text>
      <text x="15" y="340">دائمون</text>
    </g>
    <!-- Numbers left side -->
    <g fill="#0891b2" fill-opacity="0.7" font-family="Arial" font-size="11" font-weight="bold">
      <text x="-230" y="30">100%</text>
      <text x="-160" y="100">60%</text>
      <text x="-110" y="175">30%</text>
      <text x="-70" y="238">10%</text>
      <text x="-50" y="340">5%</text>
    </g>
    <!-- Funnel outline -->
    <path d="M-200,0 L200,0 L120,130 L70,200 L30,260 L0,310 L-30,260 L-70,200 L-120,130 L-200,0Z" 
      fill="none" stroke="#0891b2" stroke-width="2" stroke-opacity="0.4"/>
  </g>
  <!-- People icons entering top -->
  <g fill="#0891b2" fill-opacity="0.5" transform="translate(400,60)">
    <circle cx="-150" cy="-30" r="10"/>
    <circle cx="-80" cy="-25" r="10"/>
    <circle cx="-10" cy="-30" r="10"/>
    <circle cx="60" cy="-25" r="10"/>
    <circle cx="140" cy="-30" r="10"/>
  </g>
  <!-- Star customer icon at bottom -->
  <g transform="translate(400, 400)" fill="#0891b2" opacity="0.7">
    <circle cx="0" cy="0" r="20" fill="#0891b2" fill-opacity="0.2" stroke="#0891b2" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="16">★</text>
  </g>
  <!-- Conversion rate badge -->
  <rect x="570" y="160" width="150" height="70" rx="12" fill="#031520" stroke="#0891b2" stroke-width="2" stroke-opacity="0.6"/>
  <text x="645" y="190" text-anchor="middle" font-size="13" fill="#f5f0e8" fill-opacity="0.5" font-family="Arial">Conversion</text>
  <text x="645" y="220" text-anchor="middle" font-size="26" font-weight="900" fill="#0891b2" font-family="Arial">×2</text>
</svg>