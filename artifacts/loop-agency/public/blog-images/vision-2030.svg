<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#04102a"/>
      <stop offset="100%" stop-color="#020710"/>
    </radialGradient>
    <radialGradient id="horizGlow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Sky glow horizon -->
  <ellipse cx="400" cy="420" rx="500" ry="200" fill="url(#horizGlow)"/>
  <!-- Stars in sky -->
  <g fill="#f5f0e8" opacity="0.5">
    <circle cx="100" cy="60" r="1.5"/>
    <circle cx="180" cy="40" r="1"/>
    <circle cx="260" cy="80" r="1.5"/>
    <circle cx="340" cy="30" r="1"/>
    <circle cx="550" cy="55" r="1.5"/>
    <circle cx="640" cy="35" r="1"/>
    <circle cx="720" cy="70" r="1.5"/>
    <circle cx="700" cy="100" r="1"/>
    <circle cx="80" cy="120" r="1"/>
    <circle cx="160" cy="90" r="1"/>
  </g>
  <!-- Crescent moon -->
  <circle cx="660" cy="110" r="40" fill="#2563eb" fill-opacity="0.25" stroke="#2563eb" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="680" cy="100" r="32" fill="#020710"/>
  <!-- City skyline silhouette -->
  <g fill="#2563eb" fill-opacity="0.3">
    <rect x="0" y="340" width="800" height="110"/>
    <!-- Buildings -->
    <rect x="50" y="280" width="40" height="160"/>
    <rect x="100" y="310" width="30" height="130"/>
    <rect x="140" y="260" width="50" height="180"/>
    <rect x="200" y="290" width="35" height="150"/>
    <rect x="245" y="270" width="45" height="170"/>
    <!-- Tower with spire -->
    <rect x="300" y="200" width="35" height="240"/>
    <polygon points="317,160 305,200 329,200" fill="#2563eb" fill-opacity="0.5"/>
    <rect x="312" y="140" width="10" height="24" fill="#2563eb" fill-opacity="0.5"/>
    <!-- More buildings -->
    <rect x="345" y="280" width="40" height="160"/>
    <rect x="395" y="250" width="55" height="190"/>
    <rect x="460" y="275" width="40" height="165"/>
    <rect x="510" y="240" width="60" height="200"/>
    <rect x="580" y="290" width="35" height="150"/>
    <rect x="625" y="260" width="45" height="180"/>
    <rect x="680" y="300" width="30" height="140"/>
    <rect x="720" y="280" width="50" height="160"/>
  </g>
  <!-- 2030 large text -->
  <text x="400" y="200" text-anchor="middle" font-size="110" font-weight="900" fill="#2563eb" fill-opacity="0.18" font-family="Arial, sans-serif" letter-spacing="-4">2030</text>
  <text x="400" y="200" text-anchor="middle" font-size="110" font-weight="900" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.35" font-family="Arial, sans-serif" letter-spacing="-4">2030</text>
  <!-- Rising arc trajectory -->
  <path d="M100,380 Q250,200 420,140 Q580,80 700,100" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-opacity="0.5" stroke-dasharray="8 5"/>
  <!-- Arrow at end of arc -->
  <circle cx="700" cy="100" r="6" fill="#2563eb"/>
  <!-- Vision label -->
  <text x="400" y="390" text-anchor="middle" font-size="13" fill="#f5f0e8" fill-opacity="0.3" font-family="Arial" letter-spacing="8">VISION · رؤية</text>
</svg>