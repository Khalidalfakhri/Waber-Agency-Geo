<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#150828"/>
      <stop offset="100%" stop-color="#0a0318"/>
    </radialGradient>
    <radialGradient id="bulbGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Bulb glow -->
  <ellipse cx="280" cy="180" rx="180" ry="160" fill="url(#bulbGlow)"/>
  <!-- Lightbulb -->
  <g transform="translate(280, 200)">
    <!-- Bulb glass -->
    <circle cx="0" cy="-60" r="70" fill="#7c3aed" fill-opacity="0.15" stroke="#7c3aed" stroke-width="2.5" stroke-opacity="0.6"/>
    <!-- Filament circuit pattern -->
    <path d="M-20,-40 L-10,-60 L0,-50 L10,-70 L20,-60 L30,-80" fill="none" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.8" stroke-linecap="round"/>
    <!-- Base -->
    <rect x="-25" y="10" width="50" height="10" rx="3" fill="#7c3aed" fill-opacity="0.4"/>
    <rect x="-20" y="20" width="40" height="10" rx="3" fill="#7c3aed" fill-opacity="0.35"/>
    <rect x="-15" y="30" width="30" height="12" rx="3" fill="#7c3aed" fill-opacity="0.3"/>
    <!-- Glow rays -->
    <g stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round">
      <line x1="-80" y1="-60" x2="-95" y2="-60"/>
      <line x1="80" y1="-60" x2="95" y2="-60"/>
      <line x1="0" y1="-140" x2="0" y2="-155"/>
      <line x1="-58" y1="-109" x2="-70" y2="-121"/>
      <line x1="58" y1="-109" x2="70" y2="-121"/>
      <line x1="-70" y1="-20" x2="-82" y2="-10"/>
      <line x1="70" y1="-20" x2="82" y2="-10"/>
    </g>
  </g>
  <!-- Rocket right side -->
  <g transform="translate(560, 280) rotate(-60)">
    <rect x="-16" y="-70" width="32" height="90" rx="6" fill="#1a0830" stroke="#7c3aed" stroke-width="2" stroke-opacity="0.6"/>
    <polygon points="-16,-70 16,-70 0,-110" fill="#7c3aed" fill-opacity="0.5"/>
    <circle cx="0" cy="-40" r="10" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-opacity="0.7"/>
    <polygon points="-16,14 -35,35 -16,20" fill="#7c3aed" fill-opacity="0.35"/>
    <polygon points="16,14 35,35 16,20" fill="#7c3aed" fill-opacity="0.35"/>
    <path d="M-10,20 Q0,50 10,20 Q5,38 0,55 Q-5,38 -10,20Z" fill="#7c3aed" fill-opacity="0.4"/>
  </g>
  <!-- Network connections dots -->
  <g opacity="0.4">
    <circle cx="120" cy="350" r="8" fill="#7c3aed"/>
    <circle cx="160" cy="310" r="6" fill="#7c3aed" fill-opacity="0.7"/>
    <circle cx="200" cy="340" r="7" fill="#7c3aed" fill-opacity="0.6"/>
    <circle cx="240" cy="290" r="5" fill="#7c3aed" fill-opacity="0.5"/>
    <line x1="120" y1="350" x2="160" y2="310" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="160" y1="310" x2="200" y2="340" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="200" y1="340" x2="240" y2="290" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="120" y1="350" x2="200" y2="340" stroke="#7c3aed" stroke-width="1" stroke-opacity="0.25"/>
  </g>
  <!-- Seedling / growth plant -->
  <g transform="translate(450, 360)" opacity="0.5">
    <line x1="0" y1="0" x2="0" y2="-60" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M0,-60 Q-30,-80 -40,-60 Q-20,-40 0,-55" fill="#7c3aed" fill-opacity="0.4"/>
    <path d="M0,-40 Q30,-55 35,-35 Q15,-20 0,-38" fill="#7c3aed" fill-opacity="0.35"/>
  </g>
</svg>