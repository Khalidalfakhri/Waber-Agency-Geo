<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a0c04"/>
      <stop offset="100%" stop-color="#0a0318"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/><line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Camera body -->
  <rect x="240" y="160" width="260" height="160" rx="16" fill="#1a0a00" stroke="#ea580c" stroke-width="2.5" stroke-opacity="0.7"/>
  <!-- Camera lens rings -->
  <circle cx="320" cy="240" r="65" fill="none" stroke="#ea580c" stroke-width="2" stroke-opacity="0.3"/>
  <circle cx="320" cy="240" r="52" fill="none" stroke="#ea580c" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="320" cy="240" r="38" fill="#0f0815" stroke="#ea580c" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="320" cy="240" r="24" fill="#ea580c" fill-opacity="0.3"/>
  <circle cx="320" cy="240" r="10" fill="#ea580c"/>
  <circle cx="314" cy="234" r="4" fill="#f5f0e8" fill-opacity="0.4"/>
  <!-- Viewfinder -->
  <rect x="440" y="175" width="50" height="40" rx="6" fill="#0f0815" stroke="#ea580c" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="446" y="181" width="38" height="28" rx="3" fill="#ea580c" fill-opacity="0.1"/>
  <!-- Record button -->
  <circle cx="460" cy="287" r="18" fill="none" stroke="#ea580c" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="460" cy="287" r="10" fill="#ea580c"/>
  <!-- Clapperboard -->
  <rect x="510" y="120" width="130" height="110" rx="8" fill="#1a0a00" stroke="#f5f0e8" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="510" y="120" width="130" height="28" rx="8" fill="#f5f0e8" fill-opacity="0.1"/>
  <!-- Clap stripes -->
  <g fill="#ea580c" fill-opacity="0.7">
    <rect x="520" y="120" width="16" height="28"/>
    <rect x="548" y="120" width="16" height="28"/>
    <rect x="576" y="120" width="16" height="28"/>
    <rect x="604" y="120" width="16" height="28"/>
  </g>
  <line x1="510" y1="148" x2="640" y2="148" stroke="#f5f0e8" stroke-width="2" stroke-opacity="0.4"/>
  <text x="575" y="178" text-anchor="middle" font-size="11" fill="#f5f0e8" fill-opacity="0.4" font-family="monospace">SCENE 01</text>
  <text x="575" y="195" text-anchor="middle" font-size="11" fill="#f5f0e8" fill-opacity="0.4" font-family="monospace">TAKE  01</text>
  <text x="575" y="212" text-anchor="middle" font-size="11" fill="#ea580c" fill-opacity="0.6" font-family="monospace">DIRECTOR</text>
  <!-- Film strip bottom -->
  <g opacity="0.4" transform="translate(100, 380)">
    <rect x="0" y="-20" width="600" height="20" rx="3" fill="#ea580c" fill-opacity="0.2" stroke="#ea580c" stroke-width="1"/>
    <g fill="none" stroke="#ea580c" stroke-width="1">
      <rect x="10" y="-16" width="20" height="12" rx="2"/>
      <rect x="40" y="-16" width="20" height="12" rx="2"/>
      <rect x="70" y="-16" width="20" height="12" rx="2"/>
      <rect x="100" y="-16" width="20" height="12" rx="2"/>
      <rect x="130" y="-16" width="20" height="12" rx="2"/>
      <rect x="160" y="-16" width="20" height="12" rx="2"/>
      <rect x="190" y="-16" width="20" height="12" rx="2"/>
      <rect x="220" y="-16" width="20" height="12" rx="2"/>
      <rect x="250" y="-16" width="20" height="12" rx="2"/>
      <rect x="280" y="-16" width="20" height="12" rx="2"/>
      <rect x="310" y="-16" width="20" height="12" rx="2"/>
      <rect x="340" y="-16" width="20" height="12" rx="2"/>
      <rect x="370" y="-16" width="20" height="12" rx="2"/>
      <rect x="400" y="-16" width="20" height="12" rx="2"/>
      <rect x="430" y="-16" width="20" height="12" rx="2"/>
      <rect x="460" y="-16" width="20" height="12" rx="2"/>
      <rect x="490" y="-16" width="20" height="12" rx="2"/>
      <rect x="520" y="-16" width="20" height="12" rx="2"/>
      <rect x="550" y="-16" width="20" height="12" rx="2"/>
      <rect x="580" y="-16" width="20" height="12" rx="2"/>
    </g>
  </g>
  <!-- Play button overlay -->
  <circle cx="150" cy="225" r="45" fill="none" stroke="#ea580c" stroke-width="2" stroke-opacity="0.4"/>
  <polygon points="140,205 140,245 175,225" fill="#ea580c" fill-opacity="0.5"/>
</svg>