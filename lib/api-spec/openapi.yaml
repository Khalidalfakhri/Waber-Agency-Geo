openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storage
    description: Public media serving
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/public-objects/{filePath}:
    get:
      operationId: getPublicObject
      tags: [storage]
      summary: Serve public media from object storage
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative path within the configured public storage search path.
      responses:
        "200":
          description: Public media bytes, optionally as a byte range.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "206":
          description: Partial public media bytes.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Public media asset not found.
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

